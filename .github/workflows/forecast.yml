# =============================================================================
# UK Economic Forecasting Pipeline — Automated Weekly Forecast
# =============================================================================
#
# Runs the forecasting pipeline every Sunday at midnight UTC and on
# manual dispatch.  Uses sample data mode to avoid API key management
# in CI.  Updated forecast CSVs and figures are committed back to the
# repository.

name: Weekly Forecast

on:
  schedule:
    # Every Sunday at 00:00 UTC
    - cron: "0 0 * * 0"
  workflow_dispatch:
    inputs:
      mode:
        description: "Pipeline mode"
        required: false
        default: "sample"
        type: choice
        options:
          - sample
          - full

permissions:
  contents: write

jobs:
  forecast:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run forecasting pipeline
        run: |
          python -m src.pipeline --mode ${{ github.event.inputs.mode || 'sample' }}
        env:
          PYTHONPATH: ${{ github.workspace }}

      - name: Commit updated forecasts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add outputs/forecasts/ outputs/figures/ data/processed/
          git diff --staged --quiet || git commit -m "chore: update forecasts [automated]"
          git push
